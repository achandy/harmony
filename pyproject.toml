[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony"
version = "0.1.0"
description = "A CLI app to interact with Spotify and Apple Music"
authors = [
    { name = "Allan", email = "chandyallan@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.1.0", 
    "pyJWT>=2.10.1",
    "rich>=14.0.0",
    "cryptography>=44.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "responses>=0.23.1",
    "black>=23.9.1",
    "ruff>=0.11.10"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harmony*"]

[project.scripts]
harmony = "harmony.main:main"
